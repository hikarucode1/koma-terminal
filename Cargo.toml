[package]
name = "koma"
version = "0.1.0"
edition = "2024"
description = "A tiling terminal emulator with a custom wgpu renderer"
repository = "https://github.com/hikarucode1/koma-terminal"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
fontdb = "0.23.0"
log = "0.4.33"
pollster = "1.0.1"
portable-pty = "0.9.0"
swash = "0.2.10"
unicode-width = "0.2.2"
vte = "0.15.0"
wgpu = "30.0.0"
winit = "0.30.13"

[target.'cfg(unix)'.dependencies]
# Only for `kill(pgid, 0)`: whether a process group still exists is how a
# suspended program is told from one that is gone. Already in the tree by way
# of portable-pty, so it costs no new compilation.
libc = "0.2"
